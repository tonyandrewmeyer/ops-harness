name: ops-harness Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - run: uv tool install tox --with tox-uv
      - name: Run linting
        run: tox -e lint

  static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      # The static environment pins the lowest supported Python.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: uv tool install tox --with tox-uv
      - name: Run static type checks
        run: tox -e static

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv tool install tox --with tox-uv

      - name: Run unit tests
        run: tox -e unit

  pip-install:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv build

      # Test that a pip install of the source dist .tar.gz will work.
      - name: Test 'pip install'
        # Shouldn't happen, but pip install will fail if ls returns multiple lines.
        run: pip install $(ls dist/ops*.gz)
