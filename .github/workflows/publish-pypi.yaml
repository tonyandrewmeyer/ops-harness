name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  # Run the full test suite before publishing a release.
  test:
    uses: ./.github/workflows/tests.yaml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: publish-pypi
      url: https://pypi.org/project/ops-harness/
    permissions:
      # id-token: required for PyPI trusted publishing (OIDC).
      # attestations: required for actions/attest{,-build-provenance}.
      # contents: read for actions/checkout.
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
      - name: Build distributions
        run: uv build
      - name: Generate CycloneDX SBOM
        run: |
          uv venv
          uv pip install .
          uvx --from cyclonedx-bom cyclonedx-py environment .venv \
            --output-format JSON \
            --output-file sbom.cdx.json
      # Two separate attestations: SLSA provenance (how it was built)
      # and CycloneDX SBOM (what's inside). attest-build-provenance
      # doesn't accept sbom-path, so the SBOM predicate needs its own call.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/*'
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'dist/*'
          sbom-path: 'sbom.cdx.json'
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Publish to PyPI
        # Trusted publishing: no API token, authenticates via OIDC.
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
