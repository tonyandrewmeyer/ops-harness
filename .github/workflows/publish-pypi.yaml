name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  # Run the full test suite before publishing a release.
  test:
    uses: ./.github/workflows/tests.yaml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: publish-pypi
      url: https://pypi.org/project/ops-harness/
    permissions:
      # id-token: required for PyPI trusted publishing (OIDC).
      # attestations: required for actions/attest{,-build-provenance}.
      # contents: read for actions/checkout.
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false
      - name: Build distributions
        run: uv build
      - name: Generate CycloneDX SBOM
        run: |
          uv venv
          uv pip install .
          uvx --from cyclonedx-bom cyclonedx-py environment .venv \
            --output-format JSON \
            --output-file sbom.cdx.json
      # Two separate attestations: SLSA provenance (how it was built)
      # and CycloneDX SBOM (what's inside). attest-build-provenance
      # doesn't accept sbom-path, so the SBOM predicate needs its own call.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: 'dist/*'
          sbom-path: 'sbom.cdx.json'
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Publish to PyPI
        # Trusted publishing: no API token, authenticates via OIDC.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
