[tox]
skipsdist=True
skip_missing_interpreters = True
envlist = lint, static, unit

[vars]
src_path = src/harness/
tst_path = test/
all_path = {[vars]src_path} {[vars]tst_path}

[testenv]
runner = uv-venv-lock-runner
setenv =
  PYTHONPATH = {toxinidir}:{toxinidir}/lib:{toxinidir}/src
  PY_COLORS=1
passenv =
  PYTHONPATH
  HOME
  PATH
  MODEL_SETTINGS

[testenv:fmt]
description = Apply coding style standards to code
dependency_groups = lint
commands =
    ruff format --preview

[testenv:lint]
description = Check code against coding style standards
dependency_groups = lint
commands =
    ruff check --preview

[testenv:static]
description = Run static type checker
# Type-check against the ops 3.x API surface (the TYPE_CHECKING imports use the
# 3.x names; the runtime fallbacks cover the 2.x names). ops 3.x requires
# Python 3.10+, so that's the floor here and for pyright's pythonVersion (see
# pyproject.toml). Python 3.8 compatibility is enforced by ruff's py38 target
# and the Python 3.8 unit-test job in CI.
basepython = python3.10
dependency_groups = static
commands =
    pyright {posargs}

[testenv:unit]
description = Run unit tests
# ops 2.x is resolved on Python 3.8/3.9 and ops 3.x on Python 3.10+, since ops
# 3.x requires Python 3.10+. pytest 9 requires Python 3.10+, so the `unit`
# dependency group in pyproject.toml splits pytest 8.3 vs 9.0 on that boundary.
dependency_groups = unit
commands =
    coverage run --source={[vars]src_path} \
             -m pytest --ignore={[vars]tst_path}smoke -v --tb native {posargs}
    coverage report
