[project]
name = "ops-harness"
description = "Testing the Python library behind great charms"
readme = "README.md"
version = "0.1"
# This is a legacy compatibility package: it targets the full range of Python
# and ops versions that charms in the wild are still pinned to, including
# Python 3.8 (paired with the ops 2.x series; ops 3.x requires Python 3.10+).
requires-python = ">=3.8"
authors = [
    {name="The Charm Tech team at Canonical Ltd.", email="charm-tech@lists.launchpad.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "ops>=2.23",
    "PyYAML==6.*",
    "websocket-client==1.*",
]

# Dev dependency groups (PEP 735). Mirrors the canonical/operator layout so
# tox + uv-venv-lock-runner pulls pinned dev deps from uv.lock rather than
# re-resolving each env; Dependabot's uv ecosystem updates these from the
# lockfile.
[dependency-groups]
lint = [
    "ruff==0.11.2",
]
static = [
    # The static env runs only on Python 3.10 (see tox.ini), so the whole
    # group is gated on >=3.10 to keep the universal resolver happy with the
    # project's >=3.8 floor — pytest 9 dropped Python 3.8/3.9, etc.
    "pyright==1.1.409; python_version >= '3.10'",
    "ops>=2.23; python_version >= '3.10'",
    "PyYAML==6.*; python_version >= '3.10'",
    "websocket-client==1.*; python_version >= '3.10'",
    "pytest~=9.0; python_version >= '3.10'",
    "typing_extensions~=4.2; python_version >= '3.10'",
]
unit = [
    "ops>=2.23",
    "PyYAML==6.*",
    "websocket-client==1.*",
    "coverage[toml]~=7.0",
    # pytest 9 requires Python >=3.10.
    "pytest~=9.0; python_version >= '3.10'",
    "pytest~=8.3; python_version < '3.10'",
    "typing_extensions~=4.2",
]

[project.urls]
"Homepage" = "https://documentation.ubuntu.com/ops/latest/"
"Repository" = "https://github.com/tonyandrewmeyer/ops-harness"
"Issues" = "https://github.com/canonical/operator/issues"
"Documentation" = "https://documentation.ubuntu.com/ops/latest/"
"Changelog" = "https://github.com/canonical/operator/blob/main/CHANGES.md"

[build-system]
requires = [
    "setuptools>=82.0.1",
]
build-backend = "setuptools.build_meta"

# This package ships the standalone ``harness`` import package. The ``ops``
# package re-exports it as ``ops.testing.Harness`` (the same way it re-exports
# ``ops-scenario``); ``ops`` is a regular package, not a namespace package, so
# nothing is contributed to the ``ops.*`` namespace here.
[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]

# Ship the PEP 561 marker so type checkers pick up the inline annotations.
[tool.setuptools.package-data]
"harness" = ["py.typed"]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

# Formatting tools configuration
[tool.autopep8]
max-line-length = 99
ignore = ["W503"]
recursive = true
jobs = -1
aggressive = 3

# Linting tools configuration
[tool.ruff]
line-length = 99
target-version = "py38"
extend-exclude = ["docs"]

# Ruff formatter configuration
[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I001",
    # pep8-naming
    "N",
    # flake8-builtins
    "A",
    # flake8-copyright
    "CPY",
    # pyupgrade
    "UP",
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # Ruff specific
    "RUF",
    # Perflint
    "PERF",
    # pyflakes-docstrings
    "D",
]
ignore = [
    # Use of `assert` detected
    "S101",
    # Do not `assert False`
    "B011",
    # `pickle`, `cPickle`, `dill`, and `shelve` modules are possibly insecure
    "S403",
    # `subprocess` module is possibly insecure
    "S404",

    # No explicit `stacklevel` keyword argument found
    "B028",

    # Return condition directly, prefer readability.
    "SIM103",
    # Use contextlib.suppress() instead of try/except: pass
    "SIM105",
    # Use a single `with` statement with multiple contexts instead of nested `with` statements
    "SIM117",

    # Missing docstring in magic method
    "D105",
    # Missing docstring in `__init__`
    "D107",

    # Manual list comprehension.
    "PERF401",
    # Manual dict comprehension.
    "PERF403",

    # Convert {} from `TypedDict` functional to class syntax
    # Note that since we have some `TypedDict`s that cannot use the class
    # syntax, we're currently choosing to be consistent in syntax even though
    # some can be moved to the class syntax.
    "UP013",

    ## Likely worth doing, but later.

    # `subprocess` call: check for execution of untrusted input
    "S603",
    # Prefer `next(iter(info_dicts))` over single element slice
    "RUF015",
    # Mutable class attributes should be annotated with `typing.ClassVar`
    "RUF012",
    # Unnecessary dict comprehension for iterable; use `dict.fromkeys` instead
    "C420",
    # Unnecessary `tuple` call (rewrite as a literal)
    "C408",
]
[tool.ruff.lint.per-file-ignores]
"test/*" = [
    # All documentation linting.
    "D",

    # Hard-coded password string.
    "S105",
    # Hard-coded password function argument.
    "S106",

    # "Useless" expression.
    "B018"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "min", "map", "range", "type", "TimeoutError", "ConnectionError", "Warning", "input", "format"]

[tool.pyright]
include = ["src/harness/*.py", "test/*.py"]
extraPaths = ["src"]
# The harness supports Python 3.8+, but it is type-checked against ops 3.x
# (whose API has the symbols the TYPE_CHECKING imports reference), and ops 3.x
# requires Python 3.10+ and uses 3.10 syntax in its own source. Analysing at a
# lower version makes pyright flag ops' internals, so we pin to 3.10 here and
# rely on ruff's py38 target plus the Python 3.8 unit-test job in CI to catch
# any use of features newer than 3.8 in the harness itself.
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "strict"
reportIncompatibleMethodOverride = false
reportImportCycles = false
reportMissingModuleSource = false
reportPrivateUsage = false
reportUnnecessaryIsInstance = false
reportUnnecessaryComparison = false
disableBytesTypePromotions = true
stubPath = ""
